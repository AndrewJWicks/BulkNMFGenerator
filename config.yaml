# Configuration for a single run. run_dpnmf.py and run_nmf.py set the dataset and
# privacy parameters for each run and restore this file afterwards.

dir_list:
  home: "."
  meta: "data/meta"
  processed_data: "data/processed"
  data_save_dir: "data_splits"
  split_save_dir: "data_splits/split_indices"

dataset_config:
  name: "TCGA-BRCA"
  count_file: "data/processed/TCGA-BRCA_primary_tumor_star_deseq_VST_lmgenes.tsv"
  annot_file: "data/meta/TCGA-BRCA_primary_tumor_subtypes.csv"
  sample_col_name: "samplesID"
  subtype_col_name: "Subtype"     # "project" for TCGA-COMBINED
  num_splits: 5
  random_seed: 42

generator_name: "nmf_sampler"
generate: true
train: true
load_from_checkpoint: false

nmf_sampler_config:
  seed: 42
  n_components: 20        # NMF rank
  nmf_batch_size: 1000
  n_clusters: 20          # k-means clusters
  n_synth_samples: -1     # -1 = same size as the training fold
  proportion_aware: true  # sample clusters proportionally to their size

dp_config:
  eps: 4                  # null for the non-private NMF variant
  mechanism: "gaussian"
  delta: 1.0e-5
  clip_l2: null           # the drivers set this to the largest per-sample L2 norm of the dataset
